name: Pipeline CI/CD Loja Veloz

on:
  push:
    branches: [ "main" ]

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build e Push do API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./microservicos/api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}

    - name: Build e Push do Serviço de Pedidos
      uses: docker/build-push-action@v5
      with:
        context: ./microservicos/servico-pedidos
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/servico-pedidos:${{ github.sha }}