name: Pipeline CI/CD Loja Veloz

on:
  push:
    branches: [ "main" ]

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Login no Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Build e Push do API Gateway
    - name: Build API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./microservicos/api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}

    # Build e Push do Serviço de Pedidos
    - name: Build Serviço de Pedidos
      uses: docker/build-push-action@v5
      with:
        context: ./microservicos/servico-pedidos
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/servico-pedidos:${{ github.sha }}

    # Deploy das atualizações no Kubernetes (Rolling Update)
    - name: Configurar Contexto K8s
      uses: azure/k8s-set-context@v3
      with:
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Aplicar Manifestos no Cluster
      run: |
        kubectl apply -f k8s/
        kubectl set image deployment/servico-pedidos pedidos=${{ secrets.DOCKER_USERNAME }}/servico-pedidos:${{ github.sha }}
        kubectl set image deployment/api-gateway gateway=${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}