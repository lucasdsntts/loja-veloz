apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-estoque
  labels:
    app: servico-estoque
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servico-estoque
  template:
    metadata:
      labels:
        app: servico-estoque
    spec:
      containers:
      - name: estoque
        image: loja-veloz/servico-estoque:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: config-loja
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: servico-estoque
spec:
  type: ClusterIP
  selector:
    app: servico-estoque
  ports:
  - port: 8080
    targetPort: 8080